<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 958" width="904" height="958" role="img" aria-label="Flow of the five archetype steps. Step 1 approves the acceptance set and floor. Step 2 runs the acceptance test: a pass joins the product, a fail goes to gap diagnosis. Gap diagnosis either joins the product, hands the gap to the archetype's next version, stops for a workflow redesign, or sends the use case to Step 3. Step 3 either stops with not now or creates the archetype. Step 4 approves the definition, Step 5 pilots and releases version 1, and other products then join through Step 2.">
  <title>Archetype creation flow</title>
  <style>
    svg { --bg:#f4f6f9; --surface:#ffffff; --ink:#17212c; --muted:#566474; --line:#7f8c9b; --accent:#2c4bb0; --accent-bg:#e9eefb; --good:#1c7350; --good-bg:#e3f3ec; --hold:#9a5410; --hold-bg:#fbefdf;
      --display:"Space Grotesk","Segoe UI",system-ui,-apple-system,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    @media (prefers-color-scheme: dark) { svg { --bg:#11161c; --surface:#1a212a; --ink:#e5eaf0; --muted:#9ba8b6; --line:#6b7785; --accent:#93a9ff; --accent-bg:#1f2944; --good:#62c89c; --good-bg:#16302a; --hold:#e2a55f; --hold-bg:#33261a; } }
    .ground { fill: var(--surface); }
    .step { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
    .diag { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .good { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.5; }
    .hold { fill: var(--hold-bg); stroke: var(--hold); stroke-width: 1.5; }
    .next { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.5; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .skip { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: var(--line); }
    .n { font-family: var(--display); font-weight: 600; font-size: 22px; fill: var(--accent); }
    .t { font-family: var(--display); font-weight: 600; font-size: 13.5px; fill: var(--ink); }
    .s { font-family: var(--body); font-size: 11px; fill: var(--muted); }
    .l { font-family: var(--body); font-size: 11px; font-weight: 500; fill: var(--ink); }
    .st { font-family: var(--mono); font-weight: 500; fill: var(--accent); }
  </style>
  <rect class="ground" x="0" y="0" width="904" height="958" rx="10"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <!-- return loop: active archetype back to Step 2 -->
  <path class="flow" d="M180 904 H24 V166 H180" marker-end="url(#arr)"/>
  <text class="l" x="34" y="880">any product can</text>
  <text class="l" x="34" y="893">now join</text>

  <!-- bypass: Step 2 straight to Step 3 -->
  <path class="skip" d="M180 202 H150 V496 H180" marker-end="url(#arr)"/>
  <text class="l" x="140" y="330" text-anchor="end">no current</text>
  <text class="l" x="140" y="344" text-anchor="end">version can</text>
  <text class="l" x="140" y="358" text-anchor="end">produce the</text>
  <text class="l" x="140" y="372" text-anchor="end">output</text>

  <!-- Step 1 -->
  <rect class="step" x="180" y="24" width="320" height="72" rx="8"/>
  <text class="n" x="200" y="68">1</text>
  <text class="t" x="232" y="56">Use case and acceptance set</text>
  <text class="s" x="232" y="75">Developers · Business Owner approves</text>

  <path class="flow" d="M340 96 V148" marker-end="url(#arr)"/>
  <text class="l" x="352" y="126">acceptance set and floor approved</text>

  <!-- Step 2 -->
  <rect class="step" x="180" y="148" width="320" height="72" rx="8"/>
  <text class="n" x="200" y="192">2</text>
  <text class="t" x="232" y="180">Choose an archetype and test</text>
  <text class="s" x="232" y="199">Developers · archetype owner advises</text>

  <path class="flow" d="M500 184 H640" marker-end="url(#arr)"/>
  <text class="l" x="570" y="177" text-anchor="middle">pass</text>

  <rect class="good" x="640" y="148" width="240" height="72" rx="8"/>
  <text class="t" x="760" y="180" text-anchor="middle">Product joins</text>
  <text class="s" x="760" y="199" text-anchor="middle">Business Owner signs and attests</text>

  <path class="flow" d="M340 220 V280" marker-end="url(#arr)"/>
  <text class="l" x="352" y="254">fail</text>

  <!-- Gap diagnosis -->
  <rect class="diag" x="180" y="280" width="320" height="120" rx="8"/>
  <text class="t" x="340" y="330" text-anchor="middle">Gap diagnosis</text>
  <text class="s" x="340" y="350" text-anchor="middle">Data science scores the product's samples</text>
  <text class="s" x="340" y="365" text-anchor="middle">on every hosted model</text>

  <path class="flow" d="M500 300 H760 V220" marker-end="url(#arr)"/>
  <text class="l" x="625" y="280" text-anchor="middle">prompt problem, or another</text>
  <text class="l" x="625" y="293" text-anchor="middle">archetype's model passes</text>

  <path class="flow" d="M500 342 H640" marker-end="url(#arr)"/>
  <text class="l" x="570" y="335" text-anchor="middle">catalog gap,</text>
  <text class="l" x="570" y="357" text-anchor="middle">in scope</text>

  <rect class="next" x="640" y="312" width="240" height="60" rx="8"/>
  <text class="t" x="760" y="338" text-anchor="middle">Archetype's next version</text>
  <text class="s" x="760" y="356" text-anchor="middle">Releasing a new version</text>

  <path class="flow" d="M500 384 H760 V452" marker-end="url(#arr)"/>
  <text class="l" x="510" y="399">beyond current models</text>

  <path class="flow" d="M340 400 V460" marker-end="url(#arr)"/>
  <text class="l" x="352" y="426">catalog gap, in no built</text>
  <text class="l" x="352" y="440">archetype's scope</text>

  <!-- Step 3 -->
  <rect class="step" x="180" y="460" width="320" height="72" rx="8"/>
  <text class="n" x="200" y="504">3</text>
  <text class="t" x="232" y="492">Capability test and reference eval</text>
  <text class="s" x="232" y="511">Platform data science team</text>

  <path class="flow" d="M500 496 H640" marker-end="url(#arr)"/>
  <text class="l" x="570" y="489" text-anchor="middle">no winning candidate,</text>
  <text class="l" x="570" y="511" text-anchor="middle">or high likelihood</text>

  <rect class="hold" x="640" y="452" width="240" height="88" rx="8"/>
  <text class="t" x="760" y="482" text-anchor="middle">Not now</text>
  <text class="s" x="760" y="502" text-anchor="middle">Redesign the workflow and re-test</text>
  <text class="s" x="760" y="517" text-anchor="middle">at the next quarterly re-evaluation</text>

  <path class="flow" d="M340 532 V598" marker-end="url(#arr)"/>
  <text class="l" x="352" y="558">candidate wins, likelihood low or medium</text>
  <text class="l" x="352" y="574">status <tspan class="st">proposed</tspan></text>

  <!-- Step 4 -->
  <rect class="step" x="180" y="598" width="320" height="72" rx="8"/>
  <text class="n" x="200" y="642">4</text>
  <text class="t" x="232" y="630">Define and approve</text>
  <text class="s" x="232" y="649">Archetype owner · Platform Owner approves</text>

  <path class="flow" d="M340 670 V736" marker-end="url(#arr)"/>
  <text class="l" x="352" y="696">definition approved</text>
  <text class="l" x="352" y="712">status <tspan class="st">pilot</tspan></text>

  <!-- Step 5 -->
  <rect class="step" x="180" y="736" width="320" height="72" rx="8"/>
  <text class="n" x="200" y="780">5</text>
  <text class="t" x="232" y="768">Pilot and release version 1</text>
  <text class="s" x="232" y="787">Archetype owner · one pilot product</text>

  <path class="flow" d="M340 808 V874" marker-end="url(#arr)"/>
  <text class="l" x="352" y="834">go-active criteria met</text>
  <text class="l" x="352" y="850">status <tspan class="st">active</tspan></text>

  <!-- End -->
  <rect class="good" x="180" y="874" width="320" height="60" rx="8"/>
  <text class="t" x="340" y="900" text-anchor="middle">Archetype active</text>
  <text class="s" x="340" y="918" text-anchor="middle"><tspan class="st">&lt;id&gt;-v1</tspan> is current, with the pilot product on it</text>
</svg>
